<!DOCTYPE html>
<html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>
<style>*{margin:0;padding:0}html,body{background:transparent;width:100%;height:100%;overflow:hidden}img{width:100%;height:100%;object-fit:contain}</style>
</head><body>
<img id="p" src="clawd-idle.gif">
<script>
var states=['idle','thinking','typing','happy','sleeping'];
var idleTimer=null;

function show(s){
  if(states.indexOf(s)<0) s='idle';
  document.getElementById('p').src='clawd-'+s+'.gif';
  // 非idle状态5秒后自动回idle（点击触发的临时状态）
  if(idleTimer) clearTimeout(idleTimer);
  if(s!=='idle' && s!=='sleeping'){
    idleTimer=setTimeout(function(){ show('idle'); },5000);
  }
}

window.petEngine={
  onTap:function(){ show(Math.random()<0.5?'happy':'thinking'); },
  onDoubleTap:function(){ show('typing'); },
  onLongPress:function(){ show('sleeping'); }
};

show('idle');
</script>
</body></html>
