<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0}
html,body{background:transparent;width:100%;height:100%;overflow:hidden;position:relative}
#pet-container{width:100%;height:100%;position:relative}
#pet{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#pet svg{width:100%;height:100%}
#bubble{
  position:absolute;top:2px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,0.95);border-radius:12px;padding:6px 10px;
  font-size:12px;font-family:sans-serif;color:#333;
  pointer-events:none;
  max-width:130px;white-space:normal;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  z-index:999;
}
</style>
</head><body>
<div id="pet-container">
  <div id="bubble">HELLO</div>
  <div id="pet"></div>
</div>
<script>
var SVG_BASE = 'file:///sdcard/Download/clawd-pet/all-svgs/';
var STATES = {
  'idle':           'clawd-mini-idle.svg',
  'enter':          'clawd-mini-enter.svg'
};
var currentState = 'idle';
var svgCache = {};

function loadSVG(state) {
  var file = STATES[state] || STATES['idle'];
  if (svgCache[file]) { document.getElementById('pet').innerHTML = svgCache[file]; return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', SVG_BASE + file, true);
  xhr.onload = function() {
    if (xhr.status === 200 || xhr.status === 0) {
      svgCache[file] = xhr.responseText;
      if (currentState === state) document.getElementById('pet').innerHTML = xhr.responseText;
    }
  };
  xhr.send();
}

function show(s) { if (!STATES[s]) s='idle'; currentState=s; loadSVG(s); }

show('idle');
</script>
</body></html>
